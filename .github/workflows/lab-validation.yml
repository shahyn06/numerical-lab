name: Lab validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate lab
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check JavaScript syntax
        run: |
          for source in docs/*.js; do
            node --check "$source"
          done
      - name: Verify numerical calculations and interactive controls
        run: node --test tests/*.test.mjs
